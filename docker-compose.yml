services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
    ports:
      - "5432:5432"            # exposed for local inspection; not required by the app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 2s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  app:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://logs:logs@postgres:5432/logs"
      RETENTION_DAYS: "30"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  pgdata:
